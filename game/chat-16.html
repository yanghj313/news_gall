<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>제가 잘못 봤어요 · 블러드로드 온라인</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
		<link rel="stylesheet" href="assets/game.css" />
		<link rel="stylesheet" href="assets/chat.css" />
	</head>
	<!--
		data-me      : 내 캐릭터 (귓속말 To 표시 기준)
		data-partner : 귓속말 상대
		data-start   : 첫 줄 시각
		data-party   : 이름:역할,이름:역할 (없으면 파티창 숨김)
	-->
	<body class="chat-page" data-me="킹우요" data-partner="루비짱" data-start="22:26" data-party="킹우요:탱커,달빛소금:힐러,무명검사:딜러,새벽고양이:딜러">
		<header class="topbar">
			<a class="logo-mini" href="index.html"><img src="img/logo-sm.webp" alt="BLOODROAD" /></a>
			<span class="crumb">채팅 기록 · 제가 잘못 봤어요</span>
			<nav>
				<a class="g-btn" href="log.html">기록 <kbd>L</kbd></a>
				<a class="g-btn" href="character.html">캐릭터 <kbd>C</kbd></a>
			</nav>
		</header>

		<!-- 배경 이미지: img/scene-16.webp 파일을 넣으면 자동으로 깔립니다 -->
		<div class="scene-bg"><img src="img/scene-16.webp" alt="" onerror="this.remove()" /></div>
		<div class="fx-layer" aria-hidden="true"></div>

		<main class="scene">
			<section class="scene-head">
				<div>
					<div class="no">CHAPTER 16</div>
					<h1>제가 잘못 봤어요</h1>
				</div>
				<div class="place">킹우요 시점 · 공략 실패</div>
			</section>

			<aside class="party panel">
				<div class="panel-title">PARTY</div>
				<ul></ul>
			</aside>

			<section class="chatwin panel">
				<div class="chat-tabs"></div>
				<div class="chat-log" aria-live="polite"></div>
				<div class="typing"></div>
				<div class="chat-input"><b>[킹우요]</b> 메시지를 입력하세요…</div>
			</section>

			<div class="controls">
				<div class="grp">
					<button class="g-btn" type="button" data-act="toggle">▶ 재생</button>
					<button class="g-btn" type="button" data-act="replay">↺ 다시보기</button>
					<button class="g-btn" type="button" data-act="all">전체 보기</button>
				</div>
				<div class="grp">
					<button class="g-btn" type="button" data-act="speed">속도 ×1</button>
				</div>
			</div>

			<nav class="scene-nav">
				<a class="g-btn prev" href="#">◀ 이전</a>
				<a class="g-btn" href="log.html">목록</a>
				<a class="g-btn next" href="#">다음 ▶</a>
			</nav>
		</main>

		<!-- ===== 대사 스크립트: 위에서부터 순서대로 재생됩니다 ===== -->
		<template id="script">
			<p data-ch="party" data-who="킹우요">힐러 뒤로</p>
			<p data-ch="party" data-who="달빛소금">지금 오른쪽이 더 안전해요</p>
			<p data-ch="party" data-who="킹우요">내가 지정한 자리로</p>
			<p data-ch="party" data-who="달빛소금">거기 장판 생겨요</p>
			<p data-ch="party" data-who="킹우요">내가 막는다고 했잖아요</p>
			<p data-ch="system" data-fx="shake" data-wait="1800">보스가 방향을 틀었습니다.</p>
			<p data-ch="alert" data-fx="flash hp:킹우요:9">킹우요 님의 생존기가 늦었습니다!</p>
			<p data-ch="alert" data-fx="dead:무명검사">무명검사 님이 사망했습니다.</p>
			<p data-ch="alert" data-fx="dead:새벽고양이">새벽고양이 님이 사망했습니다.</p>
			<p data-ch="alert" data-fx="hp:all:0">공략에 실패했습니다.</p>
			<p data-ch="party" data-who="달빛소금" data-wait="2400">오른쪽 가자고 했는데요</p>
			<p data-ch="party" data-who="킹우요" data-wait="3400">제가 잘못 봤어요 죄송합니다</p>
			<p data-ch="party" data-who="킹우요">다음엔 오른쪽으로 갈게요</p>
		</template>

		<p class="ai-note">※ 세부 이미지는 AI로 제작되었습니다.</p>

		<script src="assets/scenes.js"></script>
		<script src="assets/chat.js"></script>
		<script src="assets/keys.js"></script>
	</body>
</html>

<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>에이 설마 · 블러드로드 온라인</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
		<link rel="stylesheet" href="assets/game.css" />
		<link rel="stylesheet" href="assets/chat.css" />
	</head>
	<!--
		data-me      : 내 캐릭터 (귓속말 To 표시 기준)
		data-partner : 귓속말 상대
		data-start   : 첫 줄 시각
		data-party   : 이름:역할,이름:역할 (없으면 파티창 숨김)
	-->
	<body class="chat-page" data-me="루비짱" data-partner="킹우요" data-start="23:58">
		<header class="topbar">
			<a class="logo-mini" href="index.html">BLOODLORD</a>
			<span class="crumb">채팅 기록 · 에이 설마</span>
			<nav>
				<a class="g-btn" href="log.html">기록 <kbd>L</kbd></a>
				<a class="g-btn" href="character.html">캐릭터 <kbd>C</kbd></a>
			</nav>
		</header>

		<!-- 배경 이미지: img/scene-07.webp 파일을 넣으면 자동으로 깔립니다 -->
		<div class="scene-bg"><img src="img/scene-07.webp" alt="" onerror="this.remove()" /></div>
		<div class="fx-layer" aria-hidden="true"></div>

		<main class="scene">
			<section class="scene-head">
				<div>
					<div class="no">CHAPTER 07</div>
					<h1>에이 설마</h1>
				</div>
				<div class="place">동굴 지름길</div>
			</section>

			<aside class="party panel">
				<div class="panel-title">PARTY</div>
				<ul></ul>
			</aside>

			<section class="chatwin panel">
				<div class="chat-tabs"></div>
				<div class="chat-log" aria-live="polite"></div>
				<div class="typing"></div>
				<div class="chat-input"><b>[루비짱]</b> 메시지를 입력하세요…</div>
			</section>

			<div class="controls">
				<div class="grp">
					<button class="g-btn" type="button" data-act="toggle">▶ 재생</button>
					<button class="g-btn" type="button" data-act="replay">↺ 다시보기</button>
					<button class="g-btn" type="button" data-act="all">전체 보기</button>
				</div>
				<div class="grp">
					<button class="g-btn" type="button" data-act="speed">속도 ×1</button>
				</div>
			</div>

			<nav class="scene-nav">
				<a class="g-btn prev" href="#">◀ 이전</a>
				<a class="g-btn" href="log.html">목록</a>
				<a class="g-btn next" href="#">다음 ▶</a>
			</nav>
		</main>

		<!-- ===== 대사 스크립트: 위에서부터 순서대로 재생됩니다 ===== -->
		<template id="script">
			<p data-ch="system">킹우요 님이 동굴 지름길을 찾고 있습니다.</p>
			<p data-ch="whisper" data-who="루비짱">우요야 거기 낙사 구간</p>
			<p data-ch="whisper" data-who="킹우요">ㄱㅊㄱㅊ</p>
			<p data-ch="whisper" data-who="루비짱">탱커도 낙사하면 죽어</p>
			<p data-ch="whisper" data-who="킹우요">에이 설마</p>
			<p data-ch="alert" data-fx="shake flash" data-wait="3000">킹우요 님이 낙사했습니다.</p>
			<p data-ch="whisper" data-who="킹우요">루비야ㅠㅠ</p>
			<p data-ch="whisper" data-who="킹우요">나 살려줘</p>
			<p data-ch="whisper" data-who="루비짱">낙사는 부활도 안 돼 바보야ㅋㅋㅋㅋ</p>
			<p data-ch="whisper" data-who="킹우요">너무 매정해ㅠㅠㅠㅠ</p>
		</template>

		<p class="ai-note">※ 세부 이미지는 AI로 제작되었습니다.</p>

		<script src="assets/scenes.js"></script>
		<script src="assets/chat.js"></script>
		<script src="assets/keys.js"></script>
	</body>
</html>

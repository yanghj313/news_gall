<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>내 뒤에 붙어 · 블러드로드 온라인</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
		<link rel="stylesheet" href="assets/game.css" />
		<link rel="stylesheet" href="assets/chat.css" />
	</head>
	<!--
		data-me      : 내 캐릭터 (귓속말 To 표시 기준)
		data-partner : 귓속말 상대
		data-start   : 첫 줄 시각
		data-party   : 이름:역할,이름:역할 (없으면 파티창 숨김)
	-->
	<body class="chat-page" data-me="루비짱" data-partner="킹우요" data-start="23:05" data-party="킹우요:탱커,루비짱:힐러,흑룡기사:딜러,이올쿄:딜러">
		<header class="topbar">
			<a class="logo-mini" href="index.html"><img src="img/logo-sm.webp" alt="BLOODROAD" /></a>
			<span class="crumb">채팅 기록 · 내 뒤에 붙어</span>
			<nav>
				<a class="g-btn" href="log.html">기록 <kbd>L</kbd></a>
				<a class="g-btn" href="character.html">캐릭터 <kbd>C</kbd></a>
			</nav>
		</header>

		<!-- 배경 이미지: img/scene-03.webp 파일을 넣으면 자동으로 깔립니다 -->
		<div class="scene-bg"><img src="img/scene-03.webp" alt="" onerror="this.remove()" /></div>
		<div class="fx-layer" aria-hidden="true"></div>

		<main class="scene">
			<section class="scene-head">
				<div>
					<div class="no">CHAPTER 03</div>
					<h1>내 뒤에 붙어</h1>
				</div>
				<div class="place">망자의 성채 · 2페이즈</div>
			</section>

			<aside class="party panel">
				<div class="panel-title">PARTY</div>
				<ul></ul>
			</aside>

			<section class="chatwin panel">
				<div class="chat-tabs"></div>
				<div class="chat-log" aria-live="polite"></div>
				<div class="typing"></div>
				<div class="chat-input"><b>[루비짱]</b> 메시지를 입력하세요…</div>
			</section>

			<div class="controls">
				<div class="grp">
					<button class="g-btn" type="button" data-act="toggle">▶ 재생</button>
					<button class="g-btn" type="button" data-act="replay">↺ 다시보기</button>
					<button class="g-btn" type="button" data-act="all">전체 보기</button>
				</div>
				<div class="grp">
					<button class="g-btn" type="button" data-act="speed">속도 ×1</button>
				</div>
			</div>

			<nav class="scene-nav">
				<a class="g-btn prev" href="#">◀ 이전</a>
				<a class="g-btn" href="log.html">목록</a>
				<a class="g-btn next" href="#">다음 ▶</a>
			</nav>
		</main>

		<!-- ===== 대사 스크립트: 위에서부터 순서대로 재생됩니다 ===== -->
		<template id="script">
			<p data-ch="party" data-who="킹우요">루비는 내 왼쪽 뒤</p>
			<p data-ch="party" data-who="루비짱">난 오른쪽이 편한데</p>
			<p data-ch="party" data-who="킹우요">오른쪽 2페에서 장판 깔려</p>
			<p data-ch="party" data-who="루비짱">타이밍 맞춰 피하면 돼</p>
			<p data-ch="party" data-who="킹우요">ㅋㅋㅋㅋ알아 너가 잘하는 거</p>
			<p data-ch="party" data-who="킹우요">그래도 내 뒤에 붙어 내가 막을게</p>
			<p data-ch="system">루비짱 님이 위치를 옮겼습니다.</p>
			<p data-ch="divider">— 2페이즈 —</p>
			<p data-ch="alert" data-fx="shake flash hp:킹우요:41">보스가 오른쪽 바닥을 쓸어 버립니다!</p>
			<p data-ch="system">킹우요 님이 [철벽의 맹세]를 사용했습니다.</p>
			<p data-ch="system" data-fx="hp:킹우요:100 petals">루비짱 님이 [장미빛 축복]을 시전했습니다. 킹우요 님의 생명력이 회복됩니다.</p>
			<p data-ch="system">파티원 전원 생존.</p>
		</template>

		<p class="ai-note">※ 세부 이미지는 AI로 제작되었습니다.</p>

		<script src="assets/scenes.js"></script>
		<script src="assets/chat.js"></script>
		<script src="assets/keys.js"></script>
	</body>
</html>

<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>흑기사단 첫 레이드 · 블러드로드 온라인</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
		<link rel="stylesheet" href="assets/game.css" />
		<link rel="stylesheet" href="assets/chat.css" />
	</head>
	<!--
		data-me      : 내 캐릭터 (귓속말 To 표시 기준)
		data-partner : 귓속말 상대
		data-start   : 첫 줄 시각
		data-party   : 이름:역할,이름:역할 (없으면 파티창 숨김)
	-->
	<body class="chat-page" data-me="루비짱" data-partner="킹우요" data-start="22:40" data-party="킹우요:탱커,루비짱:힐러,뼈다귀왕:딜러,흑룡기사:딜러,이올쿄:딜러,토끼발:딜러">
		<header class="topbar">
			<a class="logo-mini" href="index.html"><img src="img/logo-sm.webp" alt="BLOODROAD" /></a>
			<span class="crumb">채팅 기록 · 흑기사단 첫 레이드</span>
			<nav>
				<a class="g-btn" href="log.html">기록 <kbd>L</kbd></a>
				<a class="g-btn" href="character.html">캐릭터 <kbd>C</kbd></a>
			</nav>
		</header>

		<!-- 배경 이미지: img/scene-01.webp 파일을 넣으면 자동으로 깔립니다 -->
		<div class="scene-bg"><img src="img/scene-01.webp" alt="" onerror="this.remove()" /></div>
		<div class="fx-layer" aria-hidden="true"></div>

		<main class="scene">
			<section class="scene-head">
				<div>
					<div class="no">CHAPTER 01</div>
					<h1>흑기사단 첫 레이드</h1>
				</div>
				<div class="place">망자의 성채</div>
			</section>

			<aside class="party panel">
				<div class="panel-title">PARTY</div>
				<ul></ul>
			</aside>

			<section class="chatwin panel">
				<div class="chat-tabs"></div>
				<div class="chat-log" aria-live="polite"></div>
				<div class="typing"></div>
				<div class="chat-input"><b>[루비짱]</b> 메시지를 입력하세요…</div>
			</section>

			<div class="controls">
				<div class="grp">
					<button class="g-btn" type="button" data-act="toggle">▶ 재생</button>
					<button class="g-btn" type="button" data-act="replay">↺ 다시보기</button>
					<button class="g-btn" type="button" data-act="all">전체 보기</button>
				</div>
				<div class="grp">
					<button class="g-btn" type="button" data-act="speed">속도 ×1</button>
				</div>
			</div>

			<nav class="scene-nav">
				<a class="g-btn prev" href="#">◀ 이전</a>
				<a class="g-btn" href="log.html">목록</a>
				<a class="g-btn next" href="#">다음 ▶</a>
			</nav>
		</main>

		<!-- ===== 대사 스크립트: 위에서부터 순서대로 재생됩니다 ===== -->
		<template id="script">
			<p data-ch="system">흑기사단 레이드 파티에 참가했습니다. [흑기사단 / 힐러 우대 / 빡겜 반 즐겜 반]</p>
			<p data-ch="party" data-who="뼈다귀왕">힐러 여캐네</p>
			<p data-ch="party" data-who="뼈다귀왕">여자면 미리 말씀 좀ㅋㅋ</p>
			<p data-ch="party" data-who="루비짱">?</p>
			<p data-ch="party" data-who="뼈다귀왕">여자들은 보통 공략 안 보고 오더라고요</p>
			<p data-ch="party" data-who="킹우요">그럼 뼈다귀왕님이 힐 하세요</p>
			<p data-ch="party" data-who="뼈다귀왕">?</p>
			<p data-ch="party" data-who="킹우요">남자라 공략 잘 아실 거 아녜요</p>
			<p data-ch="party" data-who="뼈다귀왕">농담인데 왜 진지하게ㅋㅋ</p>
			<p data-ch="party" data-who="킹우요">저도 농담인데ㅋㅋ</p>
			<p data-ch="divider">— 레이드 시작 —</p>
			<p data-ch="system" data-fx="shake">[망자의 성채] 보스 전투가 시작됩니다.</p>
			<p data-ch="alert" data-fx="flash hp:킹우요:62">보스가 광역 공격을 시전합니다!</p>
			<p data-ch="alert" data-fx="dead:뼈다귀왕">뼈다귀왕 님이 사망했습니다. (1)</p>
			<p data-ch="system" data-fx="alive:뼈다귀왕 hp:킹우요:88">뼈다귀왕 님이 부활했습니다.</p>
			<p data-ch="alert" data-fx="dead:뼈다귀왕 flash">뼈다귀왕 님이 사망했습니다. (2)</p>
			<p data-ch="system" data-fx="alive:뼈다귀왕">뼈다귀왕 님이 부활했습니다.</p>
			<p data-ch="alert" data-fx="dead:뼈다귀왕 shake">뼈다귀왕 님이 사망했습니다. (3)</p>
			<p data-ch="system" data-fx="alive:뼈다귀왕 hp:킹우요:71">뼈다귀왕 님이 부활했습니다.</p>
			<p data-ch="alert" data-fx="dead:뼈다귀왕 flash">뼈다귀왕 님이 사망했습니다. (4)</p>
			<p data-ch="system" data-fx="hp:킹우요:94">킹우요 님이 보스의 시선을 끝까지 붙잡았습니다. 어그로 유지 100%</p>
			<p data-ch="system" data-fx="shake">레이드 보스를 처치했습니다!</p>
		</template>

		<p class="ai-note">※ 세부 이미지는 AI로 제작되었습니다.</p>

		<script src="assets/scenes.js"></script>
		<script src="assets/chat.js"></script>
		<script src="assets/keys.js"></script>
	</body>
</html>

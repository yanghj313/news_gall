<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<title>둘이 진짜 사귀냐 · 블러드로드 온라인</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" />
		<link rel="stylesheet" href="assets/game.css" />
		<link rel="stylesheet" href="assets/chat.css" />
	</head>
	<!--
		data-me      : 내 캐릭터 (귓속말 To 표시 기준)
		data-partner : 귓속말 상대
		data-start   : 첫 줄 시각
		data-party   : 이름:역할,이름:역할 (없으면 파티창 숨김)
	-->
	<body class="chat-page" data-me="루비짱" data-partner="킹우요" data-start="22:50" data-party="킹우요:탱커,루비짱:힐러,흑룡기사:딜러,토끼발:딜러">
		<header class="topbar">
			<a class="logo-mini" href="index.html"><img src="img/logo-sm.webp" alt="BLOODROAD" /></a>
			<span class="crumb">채팅 기록 · 둘이 진짜 사귀냐</span>
			<nav>
				<a class="g-btn" href="log.html">기록 <kbd>L</kbd></a>
				<a class="g-btn" href="character.html">캐릭터 <kbd>C</kbd></a>
			</nav>
		</header>

		<!-- 배경 이미지: img/scene-18.webp 파일을 넣으면 자동으로 깔립니다 -->
		<div class="scene-bg"><img src="img/scene-18.webp" alt="" onerror="this.remove()" /></div>
		<div class="fx-layer" aria-hidden="true"></div>

		<main class="scene">
			<section class="scene-head">
				<div>
					<div class="no">CHAPTER 18</div>
					<h1>둘이 진짜 사귀냐</h1>
				</div>
				<div class="place">길드 광장 · 레이드 직전</div>
			</section>

			<aside class="party panel">
				<div class="panel-title">PARTY</div>
				<ul></ul>
			</aside>

			<section class="chatwin panel">
				<div class="chat-tabs"></div>
				<div class="chat-log" aria-live="polite"></div>
				<div class="typing"></div>
				<div class="chat-input"><b>[루비짱]</b> 메시지를 입력하세요…</div>
			</section>

			<div class="controls">
				<div class="grp">
					<button class="g-btn" type="button" data-act="toggle">▶ 재생</button>
					<button class="g-btn" type="button" data-act="replay">↺ 다시보기</button>
					<button class="g-btn" type="button" data-act="all">전체 보기</button>
				</div>
				<div class="grp">
					<button class="g-btn" type="button" data-act="speed">속도 ×1</button>
				</div>
			</div>

			<nav class="scene-nav">
				<a class="g-btn prev" href="#">◀ 이전</a>
				<a class="g-btn" href="log.html">목록</a>
				<a class="g-btn next" href="#">다음 ▶</a>
			</nav>
		</main>

		<!-- ===== 대사 스크립트: 위에서부터 순서대로 재생됩니다 ===== -->
		<template id="script">
			<p data-ch="system">루비짱 님이 접속했습니다.</p>
			<p data-ch="system">킹우요 님이 접속했습니다.</p>
			<p data-ch="system">킹우요 님이 루비짱 님 앞으로 달려갑니다.</p>
			<p data-ch="guild" data-who="토끼발">킹우요 또 시작이네</p>
			<p data-ch="guild" data-who="흑룡기사">둘이 진짜 사귀냐ㅋㅋ</p>
			<p data-ch="guild" data-who="킹우요">그럼 뭐가 되는데</p>
			<p data-ch="guild" data-who="루비짱">레이드나 가자</p>
			<p data-ch="guild" data-who="킹우요" data-fx="hearts">루비야 사랑해♡</p>
			<p data-ch="guild" data-who="루비짱">알겠어ㅋㅋ</p>
			<p data-ch="divider">— 레이드 입장 —</p>
			<p data-ch="system">루비짱 님이 오른쪽에 섰습니다. 킹우요 님이 그 앞을 막습니다.</p>
			<p data-ch="party" data-who="킹우요">루비 오늘 여기서 할 거야?</p>
			<p data-ch="party" data-who="루비짱">ㅇㅇ 이쪽이 편해</p>
			<p data-ch="party" data-who="킹우요">ㅇㅋ 내가 앞에서 막을게</p>
			<p data-ch="system" data-fx="petals">루비짱 님이 [성녀의 눈물]을 들어 올립니다. 킹우요 님의 생명력이 가득 찼습니다.</p>
			<p data-ch="system" data-fx="hearts">킹우요 님이 [하트] 모션을 사용했습니다.</p>
			<p data-ch="system" data-fx="hearts">루비짱 님이 [하트] 모션을 사용했습니다.</p>
			<p data-ch="system" data-wait="2800">킹우요 님이 로그아웃했습니다.</p>
		</template>

		<p class="ai-note">※ 세부 이미지는 AI로 제작되었습니다.</p>

		<script src="assets/scenes.js"></script>
		<script src="assets/chat.js"></script>
		<script src="assets/keys.js"></script>
	</body>
</html>
